
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171923">
<title>ZAQTIVO AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;font-family:Arial,sans-serif;background:#f5f6fa;
 color:#202123;height:100vh;height:100dvh;
 display:flex;overflow:hidden
}

button,textarea,select{font:inherit}
button{cursor:pointer}

.sidebar{
 width:260px;flex-shrink:0;background:#171923;color:white;
 padding:16px;display:flex;flex-direction:column
}

.logo{
 font-size:23px;font-weight:bold;margin:12px 0 25px;
 letter-spacing:.5px
}

.newchat{
 padding:13px;background:#292d3b;color:white;
 border:1px solid #444;border-radius:10px;
 text-align:left;font-size:15px
}
.newchat:hover{background:#353a4c}

.sidebar h4{color:#aab0c0;margin-top:25px}
.history{overflow:auto;flex:1}

.history button{
 display:block;width:100%;padding:11px;border:0;
 background:transparent;color:#ddd;text-align:left;
 border-radius:8px;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;margin-bottom:3px
}
.history button:hover,.history button.active{background:#292d3b}

.sidebar-bottom{border-top:1px solid #444;padding-top:12px}
.sidebar-bottom button{
 width:100%;padding:10px;background:transparent;
 color:white;border:0;text-align:left
}

.main{
 flex:1;display:flex;flex-direction:column;
 min-width:0;position:relative
}

.topbar{
 height:65px;flex-shrink:0;background:white;
 border-bottom:1px solid #eee;display:flex;
 align-items:center;justify-content:space-between;
 padding:0 20px
}

.brand{font-weight:bold;font-size:19px}
.top-actions{display:flex;gap:8px}
.top-actions button{
 padding:9px 12px;border:1px solid #ddd;
 background:white;border-radius:8px
}
.top-actions button:hover{background:#f1f2f6}

.messages{
 flex:1;overflow-y:auto;padding:25px 15px;
 display:flex;flex-direction:column;gap:22px;
 scroll-behavior:smooth
}

.welcome{
 text-align:center;margin:auto;max-width:550px;padding:20px
}
.welcome h1{font-size:32px;margin-bottom:12px}
.welcome p{color:#707789;line-height:1.6}

.message{
 max-width:850px;width:100%;margin:0 auto;
 display:flex;gap:12px;line-height:1.7;
 overflow-wrap:anywhere
}

.avatar{
 width:34px;height:34px;flex-shrink:0;border-radius:50%;
 background:#e4e8ff;display:flex;align-items:center;
 justify-content:center;font-weight:bold;color:#3949ab
}

.message-content{
 flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere
}

.message-content p{margin:0 0 12px}
.message-content strong{font-weight:700;color:#171923}
.message-content em{font-style:italic}

.message-content h1,
.message-content h2,
.message-content h3{
 line-height:1.35;margin:18px 0 9px
}
.message-content h1{font-size:23px}
.message-content h2{font-size:20px}
.message-content h3{font-size:17px}

.message-content ul,
.message-content ol{
 padding-left:25px;margin:8px 0 15px
}
.message-content li{margin:5px 0}

.message-content blockquote{
 border-left:3px solid #9ba3b5;padding:5px 13px;
 margin:12px 0;color:#596174
}

.message-content hr{
 border:0;border-top:1px solid #ddd;margin:15px 0
}

.message-content pre{
 position:relative;white-space:pre;overflow-x:auto;
 background:#171923;color:#f5f5f5;
 padding:42px 16px 16px;border-radius:10px;
 margin:12px 0;font-size:13px;line-height:1.6
}

.code-language{
 position:absolute;top:10px;left:14px;
 color:#aeb5c5;font-size:11px;
 text-transform:uppercase;letter-spacing:.5px
}

.message-content pre code{
 color:inherit;background:transparent;
 padding:0;white-space:pre;border-radius:0
}

.message-content code{
 font-family:Consolas,monospace;
 background:#e9eaf0;padding:2px 5px;
 border-radius:4px;font-size:.92em
}

.code-copy{
 position:absolute;top:7px;right:7px;
 padding:6px 9px;background:#383d4c;color:white;
 border:0;border-radius:6px;font-size:11px
}
.code-copy:hover{background:#50576b}

.message img{
 max-width:min(260px,100%);
 border-radius:12px;margin-top:8px
}

.message-actions{margin-top:9px}
.message-actions button{
 border:0;background:transparent;color:#697386;
 padding:6px 0;margin-right:12px;font-size:12px
}
.message-actions button:hover{color:#3949ab}

.composer-area{
 flex-shrink:0;padding:12px 15px 15px;background:#f5f6fa
}

.composer{
 max-width:850px;margin:auto;background:white;
 border:1px solid #ddd;border-radius:16px;
 padding:10px;box-shadow:0 3px 12px #0000000a
}

textarea{
 width:100%;border:0;outline:none;resize:none;
 min-height:55px;max-height:160px;font-size:16px;
 padding:10px;background:transparent;font-family:inherit
}

.composer-bottom{
 display:flex;justify-content:space-between;
 align-items:center;gap:8px
}

.composer-bottom button{
 border:0;border-radius:9px;padding:10px 13px
}

.attach{background:#eee;color:#222}
.attach:hover{background:#e2e2e2}
.send{background:#252b45;color:white}
.send:hover{background:#39415f}
.send:disabled{opacity:.5;cursor:not-allowed}

.hint{
 text-align:center;color:#9298a5;font-size:12px;margin:10px
}

#fileName{font-size:12px;color:#555;padding:5px}
#typing{color:#777;font-size:13px;text-align:center;padding:4px}

#settingsPanel{
 display:none;position:absolute;right:15px;top:60px;
 background:white;border:1px solid #ddd;border-radius:12px;
 padding:16px;width:260px;box-shadow:0 5px 20px #0002;z-index:5
}

#settingsPanel select{
 width:100%;padding:10px;margin-top:10px;
 border:1px solid #ddd;border-radius:8px;background:white
}

#settingsPanel button{
 margin-top:10px;padding:8px 15px;border:0;
 border-radius:7px;background:#252b45;color:white
}

@media(max-width:650px){
 .sidebar{width:65px;padding:8px}
 .logo{
  font-size:12px;writing-mode:vertical-rl;
  margin:10px auto
 }
 .newchat{font-size:0;text-align:center;padding:12px 4px}
 .newchat:after{content:"+";font-size:20px}
 .sidebar h4,.sidebar-bottom span,.history{display:none}
 .sidebar-bottom button{text-align:center;font-size:0}
 .sidebar-bottom button:after{content:"⚙";font-size:18px}
 .welcome h1{font-size:26px}
 .messages{padding:18px 10px}
 .topbar{padding:0 12px}
 .brand{font-size:16px}
 .top-actions button{padding:8px;font-size:12px}
 .message{gap:8px}
 .avatar{width:30px;height:30px}
 .composer-area{padding:8px 9px 10px}
 .hint{font-size:11px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">ZAQTIVO AI</div>

 <button class="newchat" onclick="newChat()">＋ New Chat</button>

 <h4>Recent Chats</h4>
 <div class="history" id="history"></div>

 <div class="sidebar-bottom">
  <button onclick="toggleSettings()">⚙ <span>Settings & Language</span></button>
 </div>
</aside>

<main class="main">

 <header class="topbar">
  <div class="brand">ZAQTIVO AI</div>
  <div class="top-actions">
   <button onclick="newChat()">＋ New</button>
   <button onclick="toggleSettings()">🌐 Language</button>
  </div>
 </header>

 <div id="settingsPanel">
  <b>Answer Language</b>

  <select id="language" onchange="saveLanguage()">
   <option value="Auto">Auto detect / Same as user</option>
   <option>Hindi</option>
   <option>English</option>
   <option>Hinglish</option>
   <option>Urdu</option>
   <option>Sanskrit</option>
   <option>Arabic</option>
   <option>French</option>
   <option>Spanish</option>
   <option>German</option>
   <option>Portuguese</option>
   <option>Russian</option>
   <option>Chinese</option>
   <option>Japanese</option>
   <option>Korean</option>
   <option>Italian</option>
   <option>Turkish</option>
   <option>Bengali</option>
   <option>Punjabi</option>
   <option>Tamil</option>
   <option>Telugu</option>
   <option>Marathi</option>
   <option>Gujarati</option>
   <option>Malayalam</option>
   <option>Kannada</option>
   <option>Indonesian</option>
   <option>Thai</option>
   <option>Vietnamese</option>
   <option>Dutch</option>
   <option>Greek</option>
   <option>Hebrew</option>
   <option>Polish</option>
   <option>Swahili</option>
   <option>Other supported language</option>
  </select>

  <p style="font-size:12px;color:#777">
   Choose a language for AI answers. Auto detect follows your message.
  </p>

  <button onclick="toggleSettings()">Done</button>
 </div>

 <section class="messages" id="messages">
  <div class="welcome" id="welcome">
   <h1>What can I help with?</h1>
   <p>Ask anything. Learn anything. ZAQTIVO AI is ready to help you.</p>
  </div>
 </section>

 <div id="typing"></div>

 <section class="composer-area">
  <div class="composer">

   <textarea id="question" placeholder="Message ZAQTIVO AI..." rows="2"></textarea>

   <div id="fileName"></div>

   <div class="composer-bottom">
    <div>
     <button class="attach" onclick="document.getElementById('image').click()">＋ Photo</button>
     <input
      type="file"
      id="image"
      accept="image/jpeg,image/png,image/webp"
      hidden
      onchange="showFile()"
     >
    </div>

    <button class="send" id="sendBtn" onclick="sendMessage()">Send ↑</button>
   </div>
  </div>

  <div class="hint">
   ZAQTIVO AI can make mistakes. Check important information.
  </div>
 </section>

</main>

<script>

/* APP STATE */

let chats = [];

try{
 chats = JSON.parse(localStorage.getItem("zaqtivo_chats") || "[]");
 if(!Array.isArray(chats)) chats = [];
}catch(error){
 chats = [];
}

let currentChat = [];
let selectedImage = null;
let busy = false;
let activeChatId = Date.now().toString();

const messages = document.getElementById("messages");
const question = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");


/* SAFE TEXT ESCAPING */

function escapeHTML(text){
 return String(text).replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[char]));
}


/* LATEX CLEANER */

function cleanMath(text){

 if(typeof text !== "string") return "";

 const parts = text.split(/(```[\s\S]*?```|`[^`\n]*`)/g);

 return parts.map((part,index)=>{

  if(index % 2 === 1) return part;

  const sub = "₀₁₂₃₄₅₆₇₈₉";
  const sup = "⁰¹²³⁴⁵⁶⁷⁸⁹";

  const toSub = value =>
   [...value].map(c=>sub[Number(c)] || c).join("");

  const toSup = value =>
   [...value].map(c=>sup[Number(c)] || c).join("");

  return part
   .replace(/\$\$([\s\S]*?)\$\$/g,"$1")
   .replace(/\\\[([\s\S]*?)\\\]/g,"$1")
   .replace(/\\\(([\s\S]*?)\\\)/g,"$1")
   .replace(/\$([^$\n]+)\$/g,"$1")
   .replace(/\\text\s*\{([^{}]*)\}/g,"$1")
   .replace(/\\mathrm\s*\{([^{}]*)\}/g,"$1")
   .replace(/\\mathbf\s*\{([^{}]*)\}/g,"$1")
   .replace(/\\mathit\s*\{([^{}]*)\}/g,"$1")
   .replace(/\\operatorname\s*\{([^{}]*)\}/g,"$1")
   .replace(/\\xrightarrow\s*\{([^{}]*)\}/g," --$1--> ")
   .replace(/\\longrightarrow|\\rightarrow|\\to/g," → ")
   .replace(/\\Rightarrow/g," ⇒ ")
   .replace(/\\leftarrow/g," ← ")
   .replace(/\\times/g," × ")
   .replace(/\\div/g," ÷ ")
   .replace(/\\cdot/g," · ")
   .replace(/\\pm/g," ± ")
   .replace(/\\leq|\\le/g," ≤ ")
   .replace(/\\geq|\\ge/g," ≥ ")
   .replace(/\\neq|\\ne/g," ≠ ")
   .replace(/\\approx/g," ≈ ")
   .replace(/\\pi/g,"π")
   .replace(/\\infty/g,"∞")
   .replace(/\\degree/g,"°")
   .replace(/\\sqrt\s*\{([^{}]*)\}/g,"√($1)")
   .replace(/_\{(\d+)\}/g,(_,n)=>toSub(n))
   .replace(/_(\d+)/g,(_,n)=>toSub(n))
   .replace(/\^\{(\d+)\}/g,(_,n)=>toSup(n))
   .replace(/\^(\d+)/g,(_,n)=>toSup(n))
   .replace(/\\(left|right|displaystyle|textstyle|quad|qquad)/g,"")
   .replace(/\\[a-zA-Z]+/g,"")
   .replace(/[ \t]{2,}/g," ")
   .replace(/ *\n */g,"\n")
   .trim();

 }).join("");
}


/* MARKDOWN RENDERER */

function renderMarkdown(text){

 const codeBlocks = [];

 // Extract code blocks before processing normal text
 let safe = String(text).replace(
  /```([a-zA-Z0-9_+#.-]*)[ \t]*\n?([\s\S]*?)```/g,
  (match,language,code)=>{

   const id = codeBlocks.length;
   const lang = language || "Code";

   codeBlocks.push({
    language:escapeHTML(lang),
    code:escapeHTML(code.replace(/^\n|\n$/g,""))
   });

   return `%%CODEBLOCK${id}%%`;
  }
 );

 // Escape normal text to prevent unsafe HTML
 safe = escapeHTML(safe);

 // Inline formatting
 safe = safe
  .replace(/`([^`\n]+)`/g,"<code>$1</code>")
  .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
  .replace(/__(.+?)__/g,"<strong>$1</strong>")
  .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>")
  .replace(/(^|[^_])_([^_\n]+)_(?!_)/g,"$1<em>$2</em>");

 const lines = safe.split("\n");

 let output = [];
 let paragraph = [];
 let listType = null;

 function flushParagraph(){
  if(paragraph.length){
   output.push(`<p>${paragraph.join("<br>")}</p>`);
   paragraph = [];
  }
 }

 function closeList(){
  if(listType){
   output.push(listType === "ul" ? "</ul>" : "</ol>");
   listType = null;
  }
 }

 for(const line of lines){

  const trimmed = line.trim();

  if(!trimmed){
   flushParagraph();
   closeList();
   continue;
  }

  // Code block placeholder
  if(/^%%CODEBLOCK\d+%%$/.test(trimmed)){
   flushParagraph();
   closeList();
   output.push(trimmed);
   continue;
  }

  // Headings
  const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);

  if(heading){
   flushParagraph();
   closeList();

   const level = heading[1].length;
   output.push(`<h${level}>${heading[2]}</h${level}>`);
   continue;
  }

  // Horizontal line
  if(/^([-*_])\1\1+$/.test(trimmed)){
   flushParagraph();
   closeList();
   output.push("<hr>");
   continue;
  }

  // Blockquote
  if(trimmed.startsWith("&gt; ")){
   flushParagraph();
   closeList();
   output.push(`<blockquote>${trimmed.slice(5)}</blockquote>`);
   continue;
  }

  // Unordered list
  const unordered = trimmed.match(/^[-*+]\s+(.+)$/);

  if(unordered){
   flushParagraph();

   if(listType !== "ul"){
    closeList();
    output.push("<ul>");
    listType = "ul";
   }

   output.push(`<li>${unordered[1]}</li>`);
   continue;
  }

  // Ordered list
  const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);

  if(ordered){
   flushParagraph();

   if(listType !== "ol"){
    closeList();
    output.push("<ol>");
    listType = "ol";
   }

   output.push(`<li>${ordered[1]}</li>`);
   continue;
  }

  closeList();
  paragraph.push(trimmed);
 }

 flushParagraph();
 closeList();

 let result = output.join("");

 // Restore code blocks with language labels
 result = result.replace(
  /%%CODEBLOCK(\d+)%%/g,
  (match,id)=>{

   const block = codeBlocks[Number(id)];
   if(!block) return "";

   return `
    <pre>
     <span class="code-language">${block.language}</span>
     <code>${block.code}</code>
    </pre>
   `;
  }
 );

 return result;
}


/* LANGUAGE SETTINGS */

const languageSelect = document.getElementById("language");

languageSelect.value =
 localStorage.getItem("zaqtivo_language") || "Auto";

function saveLanguage(){
 localStorage.setItem("zaqtivo_language",languageSelect.value);
}

function toggleSettings(){

 const panel = document.getElementById("settingsPanel");

 panel.style.display =
  panel.style.display === "block" ? "none" : "block";
}


/* IMAGE UPLOAD */

function showFile(){

 const file = document.getElementById("image").files[0] || null;

 selectedImage = file;

 if(file && !["image/jpeg","image/png","image/webp"].includes(file.type)){
  alert("Please upload JPG, PNG or WEBP image.");
  selectedImage = null;
  document.getElementById("image").value = "";
 }

 if(file && file.size > 10 * 1024 * 1024){
  alert("Image size must be below 10 MB.");
  selectedImage = null;
  document.getElementById("image").value = "";
 }

 document.getElementById("fileName").textContent =
  selectedImage ? "📎 " + selectedImage.name : "";
}


/* WELCOME SCREEN */

function renderWelcome(){

 messages.innerHTML = `
  <div class="welcome" id="welcome">
   <h1>What can I help with?</h1>
   <p>Ask anything. Learn anything. ZAQTIVO AI is ready to help you.</p>
  </div>
 `;
}


/* MESSAGE DISPLAY */

function addMessage(role,text,imageUrl){

 const wrap = document.createElement("div");
 wrap.className = "message";

 const avatar = document.createElement("div");
 avatar.className = "avatar";
 avatar.textContent = role === "user" ? "Y" : "Z";

 const content = document.createElement("div");
 content.className = "message-content";

 const cleanText = cleanMath(text);

 if(role === "ai"){
  content.innerHTML = renderMarkdown(cleanText);
 }else{
  content.textContent = cleanText;
 }

 if(imageUrl){

  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = "Uploaded image";

  img.onload = ()=>URL.revokeObjectURL(imageUrl);
  img.onerror = ()=>URL.revokeObjectURL(imageUrl);

  content.appendChild(document.createElement("br"));
  content.appendChild(img);
 }

 if(role === "ai"){

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const copy = document.createElement("button");
  copy.textContent = "📋 Copy answer";

  copy.onclick = async ()=>{

   try{
    await navigator.clipboard.writeText(cleanText);
    copy.textContent = "Copied!";
    setTimeout(()=>copy.textContent="📋 Copy answer",1500);
   }catch(error){
    alert("Copy failed. Please select and copy the answer.");
   }
  };

  actions.appendChild(copy);
  content.appendChild(actions);

  // Copy code buttons
  content.querySelectorAll("pre").forEach(pre=>{

   const code = pre.querySelector("code");
   if(!code) return;

   const button = document.createElement("button");
   button.className = "code-copy";
   button.textContent = "Copy code";

   button.onclick = async ()=>{

    try{
     await navigator.clipboard.writeText(code.textContent);
     button.textContent = "Copied!";
     setTimeout(()=>button.textContent="Copy code",1500);
    }catch(error){
     alert("Unable to copy code.");
    }
   };

   pre.appendChild(button);
  });
 }

 wrap.append(avatar,content);
 messages.appendChild(wrap);
 messages.scrollTop = messages.scrollHeight;
}


/* SAVE CHAT */

function saveChat(){

 if(!currentChat.length) return;

 const first = currentChat.find(m=>m.role==="user");

 const title = first
  ? first.text.slice(0,45) || "Image question"
  : "New Chat";

 const oldIndex = chats.findIndex(c=>c.id===activeChatId);

 const item = {
  id:activeChatId,
  title,
  messages:currentChat
 };

 if(oldIndex >= 0){
  chats[oldIndex] = item;
 }else{
  chats.unshift(item);
 }

 chats = chats.slice(0,50);

 try{
  localStorage.setItem("zaqtivo_chats",JSON.stringify(chats));
 }catch(error){
  console.error("Chat saving failed:",error);
  alert("Storage is full. Some old chats may need to be deleted.");
 }

 renderHistory();
}


/* CHAT HISTORY */

function renderHistory(){

 const box = document.getElementById("history");
 box.innerHTML = "";

 chats.forEach(chat=>{

  const button = document.createElement("button");
  button.textContent = chat.title || "New Chat";

  if(chat.id === activeChatId){
   button.classList.add("active");
  }

  button.onclick = ()=>openChat(chat.id);
  box.appendChild(button);
 });
}

function openChat(id){

 const chat = chats.find(c=>c.id===id);
 if(!chat) return;

 activeChatId = chat.id;
 currentChat = chat.messages || [];

 selectedImage = null;

 document.getElementById("image").value = "";
 document.getElementById("fileName").textContent = "";
 question.value = "";

 renderWelcome();

 currentChat.forEach(message=>{
  addMessage(message.role,message.text,null);
 });

 renderHistory();
}


/* NEW CHAT */

function newChat(){

 currentChat = [];
 activeChatId = Date.now().toString();
 selectedImage = null;

 document.getElementById("image").value = "";
 document.getElementById("fileName").textContent = "";

 question.value = "";

 renderWelcome();
 renderHistory();
}


/* SEND MESSAGE */

async function sendMessage(){

 if(busy) return;

 const text = question.value.trim();

 if(!text && !selectedImage){
  alert("Please write a question or select a photo.");
  return;
 }

 const image = selectedImage;

 const imageUrl = image ? URL.createObjectURL(image) : null;

 currentChat.push({
  role:"user",
  text:text || "Please inspect the uploaded image.",
  imageData:null
 });

 addMessage(
  "user",
  text || "Please inspect the uploaded image.",
  imageUrl
 );

 saveChat();

 question.value = "";
 selectedImage = null;

 document.getElementById("image").value = "";
 document.getElementById("fileName").textContent = "";

 busy = true;
 sendBtn.disabled = true;
 sendBtn.textContent = "...";

 document.getElementById("typing").textContent =
  "ZAQTIVO AI is thinking...";

 try{

  const language = languageSelect.value;

  const history = currentChat.slice(-12).map(message=>
   (message.role==="user" ? "User: " : "Assistant: ") +
   cleanMath(message.text)
  ).join("\n\n");

  const formattingRules = `
ANSWER FORMATTING:

- Answer the latest question first.
- Use natural paragraphs, headings, bullets or numbered steps when useful.
- Use Markdown for bold text, headings, lists and code blocks.
- Use **bold** for important words and labels.
- Put each numbered point on a separate line.
- Do not put the entire answer inside a code block.
- Do not use LaTeX.
- Write formulas in readable normal text.
- Use Unicode subscripts and superscripts where possible.
- Write chemical formulas like H₂O, CO₂, O₂ and C₆H₁₂O₆.
- Use normal arrows such as →.
- Preserve programming syntax exactly.
- Put programming code inside fenced code blocks with the language name.
- If the user requests only code, return only code.
- Do not remove required symbols, brackets or braces.
- Keep simple answers concise and explain complex answers clearly.
`;

  const prompt =
   (language === "Auto" ? "" : "Please answer in " + language + ". ") +

   "You are ZAQTIVO AI. Continue this conversation naturally. " +
   "Use previous messages only when relevant. " +
   "Prioritize the latest user question.\n\n" +

   formattingRules + "\n\n" +

   "CONVERSATION HISTORY:\n" +
   history +
   "\n\nAnswer the latest user message.";

  const form = new FormData();
  form.append("question",prompt);

  if(image){
   form.append("image",image);
  }

  const controller = new AbortController();

  const timeout = setTimeout(()=>controller.abort(),90000);

  let response;

  try{
   response = await fetch("/api/solve",{
    method:"POST",
    body:form,
    signal:controller.signal
   });
  }finally{
   clearTimeout(timeout);
  }

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || "Request failed");
  }

  const answer = cleanMath(data.answer || "No answer received.");

  currentChat.push({
   role:"ai",
   text:answer
  });

  addMessage("ai",answer);
  saveChat();

 }catch(error){

  console.error("AI request error:",error);

  const message = error.name === "AbortError"
   ? "The response is taking too long. Please try again."
   : error.message;

  const errorText = "Error: " + message;

  currentChat.push({
   role:"ai",
   text:errorText
  });

  addMessage("ai",errorText);
  saveChat();

 }finally{

  busy = false;
  sendBtn.disabled = false;
  sendBtn.textContent = "Send ↑";

  document.getElementById("typing").textContent = "";
 }
}


/* ENTER TO SEND */

question.addEventListener("keydown",event=>{

 if(event.key === "Enter" && !event.shiftKey){
  event.preventDefault();
  sendMessage();
 }

});


/* START APP */

renderHistory();

</script>
