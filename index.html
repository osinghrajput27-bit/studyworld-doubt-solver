<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3efff">
<title>AI Assistant</title>

<style>
*{box-sizing:border-box}
:root{
 --purple:#7655e9;
 --blue:#6485f5;
 --ink:#25243a;
 --muted:#85849b;
 --surface:#fff;
}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:var(--ink);
 background:linear-gradient(135deg,#f3efff,#edf5ff,#fff1fa);
 min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.topbar{
 height:70px;padding:0 22px;display:flex;
 align-items:center;justify-content:space-between;
}
.iconbtn{
 border:0;background:#ffffffc9;border-radius:14px;
 width:43px;height:43px;font-size:21px;color:#5544a0;
}
.brand{font-size:19px;font-weight:800}
.top-actions{display:flex;gap:10px;align-items:center}
.pro-small{
 border:0;border-radius:20px;padding:10px 14px;
 background:#fff0b8;color:#79521a;font-weight:700;
}
.avatar{
 width:40px;height:40px;border-radius:50%;
 background:linear-gradient(135deg,#8c6aff,#59a4f5);
 color:white;display:grid;place-items:center;font-weight:bold;
}
main{max-width:920px;margin:25px auto;padding:15px}
.hero{text-align:center;margin:25px 0 27px}
.logo{
 width:76px;height:76px;margin:auto auto 17px;
 border-radius:25px;background:linear-gradient(135deg,#7556ec,#5799f5);
 display:grid;place-items:center;color:white;font-size:39px;
 box-shadow:0 12px 28px #8069df44;
}
.hero h1{font-size:34px;margin:8px 0}
.hero p{color:var(--muted);margin:10px 0}
.askbox{
 background:white;border:1px solid #e8e2fa;
 border-radius:25px;padding:14px;
 box-shadow:0 12px 35px #7865b51a;
}
.askbox textarea{
 width:100%;height:75px;border:0;outline:0;resize:vertical;
 font-size:16px;padding:8px;color:var(--ink);
}
.askbottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.asktools{display:flex;gap:8px;align-items:center}
.smallbtn{
 border:0;background:#f4f1ff;color:#6550bd;
 border-radius:12px;padding:10px 12px;
}
.sendbtn{
 border:0;background:linear-gradient(135deg,#7855ed,#5d8ff4);
 color:white;border-radius:14px;padding:12px 20px;font-weight:bold;
}
.language{
 margin-top:12px;display:flex;justify-content:center;gap:8px;
 align-items:center;color:var(--muted);font-size:13px;
}
.language select{
 border:1px solid #e5def8;border-radius:12px;
 padding:8px;background:white;color:#51468b;
}
.section-title{
 font-size:18px;font-weight:800;margin:30px 0 14px;
}
.features{
 display:grid;grid-template-columns:repeat(3,1fr);gap:13px;
}
.feature{
 background:#ffffffd9;border:1px solid #eee9fb;
 border-radius:19px;padding:17px 10px;text-align:center;
 min-height:112px;transition:.2s;
}
.feature:active{transform:scale(.97)}
.feature .emoji{font-size:27px;display:block;margin-bottom:9px}
.feature strong{font-size:14px}
.prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.prompt{
 background:#ffffffd9;border:1px solid #eee9fb;
 border-radius:15px;padding:15px;text-align:left;
 color:#514b72;font-size:14px;
}
.upgrade{
 margin:25px 0 95px;padding:19px;border-radius:20px;
 background:linear-gradient(110deg,#fff0b9,#ffe4cb);
 display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.upgrade strong{display:block;margin-bottom:5px}
.upgrade p{margin:0;font-size:13px;color:#8c7042}
.upgrade button{
 border:0;border-radius:13px;background:#fff;
 color:#8c6325;padding:11px 14px;font-weight:bold;
}
.bottomnav{
 position:fixed;bottom:0;left:0;right:0;
 background:#ffffffed;backdrop-filter:blur(12px);
 border-top:1px solid #eee9f7;display:flex;
 justify-content:space-around;padding:10px 5px 14px;
 z-index:5;
}
.navitem{
 border:0;background:transparent;color:#9992b0;
 font-size:12px;display:grid;gap:5px;justify-items:center;
}
.navitem span{font-size:20px}
.navitem.active{color:var(--purple);font-weight:bold}
#chatScreen,#otherScreen{display:none}
.panel{
 background:#ffffffd9;border:1px solid #eee9fb;
 border-radius:20px;padding:18px;margin-top:15px;
}
.chathead{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.chathead button{border:0;background:#f0ecff;padding:10px;border-radius:12px}
.messages{display:flex;flex-direction:column;gap:13px}
.msg{
 max-width:90%;padding:13px 15px;border-radius:17px;
 line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;
}
.user{align-self:flex-end;background:#e9e3ff}
.ai{align-self:flex-start;background:#fff;border:1px solid #eee9f7}
.msg pre{
 white-space:pre-wrap;overflow-x:auto;background:#25243a;
 color:#fff;padding:13px;border-radius:12px;
}
.msg code{font-family:monospace}
.msg-actions{display:flex;gap:8px;margin-top:9px}
.msg-actions button{
 border:0;background:#f0ecff;color:#6251ad;
 padding:7px 10px;border-radius:9px;font-size:12px;
}
.chatinput{
 display:flex;gap:8px;margin-top:16px;
}
.chatinput textarea{
 flex:1;min-width:0;resize:vertical;min-height:48px;
 border:1px solid #e6e0f5;border-radius:14px;padding:13px;
}
.chatinput button{
 border:0;background:var(--purple);color:white;
 border-radius:13px;padding:0 17px;
}
.status{font-size:13px;color:#817b9a;margin:10px 0}
.settingrow{
 display:flex;justify-content:space-between;align-items:center;
 padding:14px 0;border-bottom:1px solid #eee9f7;gap:12px;
}
.settingrow button{
 border:0;background:#f0ecff;color:#5e4bb1;
 border-radius:10px;padding:9px 12px;
}
.empty{text-align:center;color:var(--muted);padding:25px}
.hidden{display:none!important}
@media(max-width:600px){
 main{padding:12px;margin:10px auto}
 .hero h1{font-size:29px}
 .features{grid-template-columns:repeat(2,1fr)}
 .topbar{padding:0 13px}
 .brand{font-size:16px}
 .pro-small{padding:9px;font-size:12px}
 .upgrade{align-items:flex-start}
}
</style>
</head>

<body>

<header class="topbar">
 <button class="iconbtn" onclick="toggleMenu()" aria-label="Menu">☰</button>
 <div class="brand">AI Assistant</div>
 <div class="top-actions">
  <button class="pro-small" onclick="showUpgrade()">♛ Pro</button>
  <div class="avatar">A</div>
 </div>
</header>

<main>
 <section id="homeScreen">
  <div class="hero">
   <div class="logo">🧠</div>
   <h1>AI Assistant</h1>
   <p>Ask • Learn • Create • Explore</p>
  </div>

  <div class="askbox">
   <textarea id="question" placeholder="Ask me anything..."></textarea>
   <div class="askbottom">
    <div class="asktools">
     <button class="smallbtn" onclick="document.getElementById('photoInput').click()">＋ Photo</button>
     <button class="smallbtn" onclick="startVoice()">🎙</button>
    </div>
    <button class="sendbtn" onclick="sendQuestion()">Send ➤</button>
   </div>
   <input id="photoInput" type="file" accept="image/*" hidden onchange="photoSelected(event)">
   <div id="photoName" class="status"></div>
  </div>

  <div class="language">
   Answer language:
   <select id="languageSelect">
    <option value="auto">Auto – Follow my question</option>
    <option value="English">English</option>
    <option value="Hindi">हिन्दी</option>
    <option value="Hinglish">Hinglish</option>
    <option value="Bengali">বাংলা</option>
    <option value="Tamil">தமிழ்</option>
    <option value="Telugu">తెలుగు</option>
    <option value="Marathi">मराठी</option>
    <option value="Gujarati">ગુજરાતી</option>
    <option value="Punjabi">ਪੰਜਾਬੀ</option>
    <option value="Urdu">اردو</option>
    <option value="Other">Other – Follow my message</option>
   </select>
  </div>

  <div class="section-title">Explore Features</div>
  <div class="features">
   <button class="feature" onclick="newChat()"><span class="emoji">💬</span><strong>New Chat</strong></button>
   <button class="feature" onclick="document.getElementById('photoInput').click()"><span class="emoji">🖼️</span><strong>Upload Photo</strong></button>
   <button class="feature" onclick="openCamera()"><span class="emoji">📷</span><strong>Use Camera</strong></button>
   <button class="feature" onclick="startVoice()"><span class="emoji">🎙️</span><strong>Voice Input</strong></button>
   <button class="feature" onclick="quickPrompt('Give me a short and clear answer to my question.')"><span class="emoji">⚡</span><strong>Quick Answers</strong></button>
   <button class="feature" onclick="quickPrompt('Help me understand this topic step by step.')"><span class="emoji">📚</span><strong>Study Help</strong></button>
  </div>

  <div class="section-title">Popular Prompts</div>
  <div class="prompts">
   <button class="prompt" onclick="quickPrompt('Explain this topic in simple words: ')">📖 Explain this topic</button>
   <button class="prompt" onclick="quickPrompt('Summarize this text: ')">📝 Summarize this text</button>
   <button class="prompt" onclick="quickPrompt('Solve this problem step by step: ')">➗ Solve this problem</button>
   <button class="prompt" onclick="quickPrompt('Help me write code for: ')">💻 Write code</button>
  </div>

  <div class="upgrade">
   <div><strong>✨ Upgrade to Pro</strong><p>Explore more possibilities with AI.</p></div>
   <button onclick="showUpgrade()">Explore</button>
  </div>
 </section>

 <section id="chatScreen">
  <div class="panel">
   <div class="chathead">
    <button onclick="goHome()">← Home</button>
    <strong>AI Assistant</strong>
    <button style="margin-left:auto" onclick="newChat()">＋ New</button>
   </div>
   <div id="messages" class="messages"></div>
   <div id="chatStatus" class="status"></div>
   <div class="chatinput">
    <textarea id="chatQuestion" placeholder="Type your message..."></textarea>
    <button onclick="sendChatQuestion()">➤</button>
   </div>
   <input id="chatPhoto" type="file" accept="image/*" hidden onchange="chatPhotoSelected(event)">
   <div style="margin-top:10px">
    <button class="smallbtn" onclick="document.getElementById('chatPhoto').click()">＋ Upload photo</button>
    <button class="smallbtn" onclick="startVoice('chatQuestion')">🎙 Voice</button>
   </div>
  </div>
 </section>

 <section id="otherScreen">
  <div class="panel">
   <div class="chathead">
    <button onclick="goHome()">← Home</button>
    <strong id="otherTitle">History</strong>
   </div>
   <div id="otherContent"></div>
  </div>
 </section>
</main>

<nav class="bottomnav">
 <button class="navitem active" onclick="goHome()" id="navHome"><span>⌂</span>Home</button>
 <button class="navitem" onclick="showHistory()" id="navHistory"><span>◷</span>History</button>
 <button class="navitem" onclick="showFavorites()" id="navFavorites"><span>☆</span>Favorites</button>
 <button class="navitem" onclick="showSettings()" id="navSettings"><span>⚙</span>Settings</button>
</nav>

<script>
let selectedImage=null;
let chatImage=null;
let currentConversation=[];
let historyData=JSON.parse(localStorage.getItem("zaqtivo_history")||"[]");
let favorites=JSON.parse(localStorage.getItem("zaqtivo_favorites")||"[]");

function saveData(){
 localStorage.setItem("zaqtivo_history",JSON.stringify(historyData));
 localStorage.setItem("zaqtivo_favorites",JSON.stringify(favorites));
}

function hideScreens(){
 document.getElementById("homeScreen").style.display="none";
 document.getElementById("chatScreen").style.display="none";
 document.getElementById("otherScreen").style.display="none";
 document.querySelectorAll(".navitem").forEach(x=>x.classList.remove("active"));
}

function goHome(){
 hideScreens();
 document.getElementById("homeScreen").style.display="block";
 document.getElementById("navHome").classList.add("active");
}

function openChat(){
 hideScreens();
 document.getElementById("chatScreen").style.display="block";
}

function newChat(){
 currentConversation=[];
 chatImage=null;
 document.getElementById("messages").innerHTML="";
 document.getElementById("chatQuestion").value="";
 document.getElementById("chatStatus").textContent="";
 openChat();
}

function startChatFromHome(question){
 newChat();
 if(question){
  document.getElementById("chatQuestion").value=question;
 }
}

function quickPrompt(prompt){
 document.getElementById("question").value=prompt;
 document.getElementById("question").focus();
}

function photoSelected(event){
 const file=event.target.files[0];
 if(!file)return;
 if(file.size>10*1024*1024){
  alert("Image size must be 10 MB or less.");
  event.target.value="";
  return;
 }
 selectedImage=file;
 document.getElementById("photoName").textContent="Selected: "+file.name;
}

function chatPhotoSelected(event){
 const file=event.target.files[0];
 if(!file)return;
 if(file.size>10*1024*1024){
  alert("Image size must be 10 MB or less.");
  event.target.value="";
  return;
 }
 chatImage=file;
 document.getElementById("chatStatus").textContent="Photo selected: "+file.name;
}

function openCamera(){
 const input=document.createElement("input");
 input.type="file";
 input.accept="image/*";
 input.capture="environment";
 input.onchange=function(e){
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>10*1024*1024){
   alert("Image size must be 10 MB or less.");
   return;
  }
  selectedImage=file;
  document.getElementById("photoName").textContent="Camera photo: "+file.name;
 };
 input.click();
}

function startVoice(target="question"){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert("Voice input is not supported in this browser.");
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="auto";
 recognition.interimResults=false;
 recognition.onresult=function(event){
  const text=event.results[0][0].transcript;
  const el=document.getElementById(target);
  el.value+=(el.value?" ":"")+text;
 };
 recognition.onerror=function(){
  alert("Voice input could not start. Please check microphone permission.");
 };
 recognition.start();
}

function addMessage(text,type){
 const messages=document.getElementById("messages");
 const wrap=document.createElement("div");
 wrap.className="msg "+type;
 const content=document.createElement("div");
 content.textContent=text;
 wrap.appendChild(content);

 if(type==="ai"){
  const actions=document.createElement("div");
  actions.className="msg-actions";
  const copy=document.createElement("button");
  copy.textContent="Copy";
  copy.onclick=()=>copyText(text);
  const save=document.createElement("button");
  save.textContent="☆ Save";
  save.onclick=()=>saveFavorite(text);
  actions.append(copy,save);
  wrap.appendChild(actions);
 }
 messages.appendChild(wrap);
 messages.scrollTop=messages.scrollHeight;
}

function copyText(text){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>alert("Copied!")).catch(()=>alert("Could not copy text."));
 }else{
  const t=document.createElement("textarea");
  t.value=text;document.body.appendChild(t);t.select();
  document.execCommand("copy");t.remove();alert("Copied!");
 }
}

function saveFavorite(answer){
 if(favorites.includes(answer)){
  alert("Already saved in Favorites.");
  return;
 }
 favorites.unshift(answer);
 saveData();
 alert("Saved to Favorites!");
}

function getLanguageInstruction(){
 const language=document.getElementById("languageSelect").value;
 if(language==="auto"||language==="Other"){
  return "Reply in the same language as the user's question. If the user mixes languages, respond naturally in that language mix.";
 }
 return "Reply in "+language+".";
}

async function askBackend(question,imageFile){
 const formData=new FormData();
 formData.append("question",question+"\n\n"+getLanguageInstruction());
 if(imageFile)formData.append("image",imageFile);

 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),90000);

 try{
  const response=await fetch("/api/solve",{
   method:"POST",
   body:formData,
   signal:controller.signal
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok){
   throw new Error(data.error||data.message||"Server error ("+response.status+").");
  }
  const answer=data.answer||data.text||data.response||data.result;
  if(!answer)throw new Error("The AI returned an empty answer. Please try again.");
  return answer;
 }finally{
  clearTimeout(timeout);
 }
}

async function sendQuestion(){
 const question=document.getElementById("question").value.trim();
 if(!question&&!selectedImage){
  alert("Please type a question or upload a photo.");
  return;
 }
 const image=selectedImage;
 selectedImage=null;
 document.getElementById("photoInput").value="";
 document.getElementById("photoName").textContent="";
 startChatFromHome();
 await sendToAI(question||"Please explain the uploaded image.",image);
 document.getElementById("question").value="";
}

async function sendChatQuestion(){
 const question=document.getElementById("chatQuestion").value.trim();
 if(!question&&!chatImage){
  alert("Please type a question or upload a photo.");
  return;
 }
 const image=chatImage;
 chatImage=null;
 document.getElementById("chatPhoto").value="";
 document.getElementById("chatQuestion").value="";
 await sendToAI(question||"Please explain the uploaded image.",image);
}

async function sendToAI(question,image){
 addMessage(question+(image?"\n[Image attached]":""),"user");
 currentConversation.push({role:"user",text:question});
 const status=document.getElementById("chatStatus");
 status.textContent="AI is thinking... Please wait.";

 const sendButtons=document.querySelectorAll(".chatinput button");
 sendButtons.forEach(b=>b.disabled=true);

 try{
  const answer=await askBackend(question,image);
  addMessage(answer,"ai");
  currentConversation.push({role:"ai",text:answer});
  historyData.unshift({
   question:question,
   answer:answer,
   date:new Date().toLocaleString()
  });
  historyData=historyData.slice(0,100);
  saveData();
  status.textContent="";
 }catch(error){
  let message=error.name==="AbortError"
   ?"The request took too long. Please try again."
   :(error.message||"Something went wrong. Please try again.");
  addMessage("Sorry, I couldn't get an answer.\n"+message,"ai");
  status.textContent="Please try again.";
 }finally{
  sendButtons.forEach(b=>b.disabled=false);
 }
}

function showHistory(){
 hideScreens();
 document.getElementById("otherScreen").style.display="block";
 document.getElementById("otherTitle").textContent="History";
 document.getElementById("navHistory").classList.add("active");
 const box=document.getElementById("otherContent");
 box.innerHTML="";
 if(!historyData.length){
  box.innerHTML='<div class="empty">No chats yet.</div>';
  return;
 }
 historyData.forEach((item)=>{
  const div=document.createElement("div");
  div.className="panel";
  const q=document.createElement("strong");
  q.textContent=item.question;
  const date=document.createElement("p");
  date.className="status";
  date.textContent=item.date;
  const a=document.createElement("p");
  a.textContent=item.answer;
  const copy=document.createElement("button");
  copy.className="smallbtn";
  copy.textContent="Copy answer";
  copy.onclick=()=>copyText(item.answer);
  div.append(q,date,a,copy);
  box.appendChild(div);
 });
}

function showFavorites(){
 hideScreens();
 document.getElementById("otherScreen").style.display="block";
 document.getElementById("otherTitle").textContent="Favorites";
 document.getElementById("navFavorites").classList.add("active");
 const box=document.getElementById("otherContent");
 box.innerHTML="";
 if(!favorites.length){
  box.innerHTML='<div class="empty">No saved answers yet.</div>';
  return;
 }
 favorites.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="panel";
  const p=document.createElement("p");
  p.textContent=item;
  const row=document.createElement("div");
  const copy=document.createElement("button");
  copy.className="smallbtn";
  copy.textContent="Copy";
  copy.onclick=()=>copyText(item);
  const remove=document.createElement("button");
  remove.className="smallbtn";
  remove.textContent="Remove";
  remove.style.marginLeft="8px";
  remove.onclick=()=>{
   favorites.splice(index,1);
   saveData();
   showFavorites();
  };
  row.append(copy,remove);
  div.append(p,row);
  box.appendChild(div);
 });
}

function showSettings(){
 hideScreens();
 document.getElementById("otherScreen").style.display="block";
 document.getElementById("otherTitle").textContent="Settings";
 document.getElementById("navSettings").classList.add("active");
 const box=document.getElementById("otherContent");
 box.innerHTML="";

 const language=document.createElement("div");
 language.className="settingrow";
 language.innerHTML="<span>Answer language</span>";
 const select=document.getElementById("languageSelect").cloneNode(true);
 select.onchange=()=>document.getElementById("languageSelect").value=select.value;
 language.appendChild(select);
 box.appendChild(language);

 const clear=document.createElement("div");
 clear.className="settingrow";
 clear.innerHTML="<span>Clear chat history</span>";
 const clearBtn=document.createElement("button");
 clearBtn.textContent="Clear";
 clearBtn.onclick=()=>{
  if(confirm("Clear all chat history?")){
   historyData=[];saveData();showHistory();
  }
 };
 clear.appendChild(clearBtn);
 box.appendChild(clear);

 const about=document.createElement("div");
 about.className="settingrow";
 about.innerHTML="<span>About AI Assistant</span><span>Version 1.0</span>";
 box.appendChild(about);
}

function toggleMenu(){
 const choice=prompt("Type:\n1. Home\n2. History\n3. Favorites\n4. Settings");
 if(choice==="1")goHome();
 if(choice==="2")showHistory();
 if(choice==="3")showFavorites();
 if(choice==="4")showSettings();
}

function showUpgrade(){
 alert("Pro features are not available yet. The current AI Assistant continues to use its existing free service limits.");
}

document.getElementById("question").addEventListener("keydown",function(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();sendQuestion();
 }
});
document.getElementById("chatQuestion").addEventListener("keydown",function(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();sendChatQuestion();
 }
});

goHome();
</script>
</body>
    </html>
