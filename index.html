<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10065c">
<title>ZAQTIVO AI</title>

<style>
*{box-sizing:border-box}
:root{--purple:#9b35ff;--blue:#00c8ff;--dark:#080b48;--white:#fff}
body{
 margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;
 background:
 radial-gradient(ellipse at 15% 15%,#9b21ff 0,transparent 35%),
 radial-gradient(ellipse at 90% 30%,#007bff 0,transparent 38%),
 radial-gradient(ellipse at 50% 90%,#3511bb 0,transparent 45%),
 linear-gradient(135deg,#08052f,#101078,#080c50);
 background-attachment:fixed
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;
 background:
 radial-gradient(circle at 8% 35%,#b84aff55,transparent 20%),
 radial-gradient(circle at 90% 75%,#00baff44,transparent 25%);
 z-index:-1
}
.topbar{
 max-width:1100px;margin:auto;padding:20px 24px;
 display:flex;align-items:center;justify-content:space-between
}
.top-left,.top-right{display:flex;align-items:center;gap:14px}
.glass{
 background:linear-gradient(135deg,#ffffff32,#ffffff0b);
 border:1px solid #ffffff70;
 box-shadow:inset 0 1px 1px #ffffff55,0 8px 28px #02042e55;
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
}
.roundbtn{
 width:48px;height:48px;border-radius:50%;
 border:1px solid #ffffff70;color:white;background:#ffffff22;font-size:23px
}
.probtn{
 border:1px solid #ffe7a0;border-radius:30px;padding:11px 20px;
 color:#fff4cf;font-weight:bold;
 background:linear-gradient(135deg,#fff2a5,#9b5c16,#ffe9a0);
 box-shadow:0 0 20px #ffcc5555
}
.avatar{
 width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
 font-size:24px;background:linear-gradient(135deg,#00cfff,#6c31ff);
 border:2px solid #ffffffaa
}
main{width:min(100% - 28px,950px);margin:0 auto;padding-bottom:40px}
.hero{text-align:center;padding:4px 0 24px}
.brain{
 font-size:100px;line-height:1.2;
 filter:drop-shadow(0 0 14px #00cfff) drop-shadow(0 0 25px #ad36ff)
}
.hero h1{
 font-size:clamp(32px,7vw,56px);margin:5px 0;
 letter-spacing:1px;text-shadow:0 0 20px #36caff88
}
.hero p{margin:8px 0 22px;font-size:clamp(15px,3vw,23px);color:#e4eaff}
.askbox{
 display:flex;align-items:center;gap:12px;padding:12px 15px;
 border-radius:35px;margin:0 auto 12px;max-width:900px
}
.askicon{font-size:30px}
.askbox textarea{
 flex:1;min-width:0;height:55px;resize:none;border:0;outline:0;
 background:transparent;color:white;padding:16px 5px;font-size:17px
}
.askbox textarea::placeholder,.chatinput textarea::placeholder{color:#e0e6ff}
.sendbtn{
 width:65px;height:65px;border:1px solid #ffffff88;border-radius:50%;
 color:white;font-size:30px;
 background:linear-gradient(135deg,#bd22ff,#5224ff,#007fff);
 box-shadow:0 0 22px #9c35ff99
}
.section-title{
 display:flex;align-items:center;justify-content:space-between;
 font-size:22px;font-weight:bold;margin:27px 5px 15px
}
.seeall{border:0;background:transparent;color:#42e7ff;font-weight:bold;font-size:16px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.feature{
 min-height:145px;border-radius:25px;padding:15px 8px;color:white;
 text-align:center;transition:.2s
}
.feature:active{transform:scale(.97)}
.feature .emoji{
 display:block;font-size:43px;margin-bottom:10px;
 filter:drop-shadow(0 0 9px #00cfff)
}
.feature strong{font-size:17px}
.feature:nth-child(1){background:linear-gradient(135deg,#b32aff55,#007dff55)}
.feature:nth-child(2){background:linear-gradient(135deg,#007dff55,#632aff55)}
.feature:nth-child(3){background:linear-gradient(135deg,#8c32ff66,#00cfff55)}
.feature:nth-child(4){background:linear-gradient(135deg,#7c24ff66,#225cff55)}
.feature:nth-child(5){background:linear-gradient(135deg,#ffb31f55,#8b26ff55)}
.feature:nth-child(6){background:linear-gradient(135deg,#00cfff55,#642bff66)}
.prompts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prompt{
 min-height:78px;border-radius:19px;padding:14px;display:flex;
 align-items:center;gap:13px;color:white;text-align:left;font-weight:bold;font-size:15px
}
.prompt .emoji{font-size:29px}
.upgrade{
 margin:25px 0 20px;border-radius:25px;padding:17px 20px;
 display:flex;justify-content:space-between;align-items:center;
 gap:12px;color:#301300;
 background:linear-gradient(110deg,#ffe48a,#ffb82d,#ffdf78);
 border:1px solid #fff2b0;box-shadow:0 0 25px #ffca5266
}
.upgrade strong{font-size:20px}
.upgrade p{margin:5px 0 0}
.upgrade button{
 border:0;border-radius:25px;padding:13px 20px;
 background:linear-gradient(135deg,#a600ff,#4920d7);
 color:white;font-weight:bold;box-shadow:0 0 15px #832aff77
}
.status{color:#d7e7ff;font-size:13px;margin:10px 4px}
#chatScreen,#otherScreen{display:none}
.panel{padding:18px;border-radius:23px;margin:15px 0}
.chathead{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.backbtn{
 border:0;border-radius:12px;padding:10px 14px;
 color:white;background:#ffffff25
}
.messages{display:flex;flex-direction:column;gap:13px}
.msg{
 max-width:92%;padding:14px;border-radius:18px;
 line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:linear-gradient(135deg,#8c35ff,#155eea)}
.ai{align-self:flex-start;background:#ffffff18;border:1px solid #ffffff55}
.msg-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.edit-message-btn{
 display:block;margin-top:9px;padding:7px 12px;border:1px solid #ffffff70;
 border-radius:10px;color:white;background:#ffffff22;font-size:13px
}
.msg-actions button,.smallbtn{
 border:1px solid #ffffff66;color:white;background:#ffffff20;
 border-radius:10px;padding:8px 11px
}
.chatinput{display:flex;gap:8px;margin-top:16px}
.chatinput textarea{
 flex:1;min-width:0;min-height:50px;resize:vertical;
 border:1px solid #ffffff66;border-radius:15px;padding:13px;
 color:white;background:#ffffff1c;outline:none
}
.chatinput button{
 border:0;border-radius:14px;padding:0 18px;color:white;
 background:linear-gradient(135deg,#a72aff,#155dff)
}
.empty{text-align:center;padding:25px;color:#dbe4ff}
.historyitem{padding:14px;margin:10px 0;border-radius:15px;overflow-wrap:anywhere}
.settingrow{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:14px 0;border-bottom:1px solid #ffffff33
}
.settingrow button,.settingrow select{
 padding:9px;border:1px solid #ffffff66;border-radius:10px;
 background:#ffffff22;color:white
}
.settingrow option{color:#111}
.menu{
 display:none;position:absolute;top:76px;left:18px;
 width:210px;padding:10px;border-radius:18px;z-index:10
}
.menu button{
 width:100%;padding:13px;text-align:left;border:0;
 border-radius:10px;color:white;background:transparent
}
.menu button:hover{background:#ffffff22}
.hidden{display:none!important}

/* IMAGE AND DOCUMENT ATTACHMENTS */
.attach-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-preview-list,.document-preview-list{
 display:flex;gap:10px;flex-wrap:wrap;padding:8px 2px;margin-top:8px
}
.photo-preview{
 width:94px;height:94px;position:relative;border:1px solid #ffffff66;
 border-radius:13px;overflow:hidden;background:#ffffff15
}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.photo-preview button,.document-preview button{
 position:absolute;top:4px;right:4px;width:25px;height:25px;
 border:0;border-radius:50%;background:#111b;color:white;font-weight:bold
}
.photo-count,.document-count{color:#dbe4ff;font-size:12px;margin:4px 2px}
.document-preview{
 min-width:150px;max-width:220px;min-height:76px;position:relative;
 display:flex;align-items:center;gap:9px;padding:12px 34px 12px 12px;
 border:1px solid #ffffff66;border-radius:13px;background:#ffffff15;
 overflow-wrap:anywhere
}
.document-icon{font-size:27px;flex-shrink:0}
.document-info{min-width:0}
.document-name{font-size:12px;font-weight:bold;overflow-wrap:anywhere}
.document-size{font-size:11px;color:#dbe4ff;margin-top:5px}
.voice-status{color:#9ff2ff;font-size:13px;margin:7px 4px;min-height:16px}

/* HISTORY */
.history-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}
.history-toolbar input{
 flex:1;min-width:180px;padding:12px 14px;border:1px solid #ffffff66;
 border-radius:13px;background:#ffffff18;color:white;outline:none
}
.history-toolbar input::placeholder{color:#dbe4ff}
.history-card{
 padding:15px;border-radius:17px;margin:12px 0;
 border:1px solid #ffffff50;background:#ffffff12
}
.history-card.pinned{border-color:#ffd66b;box-shadow:0 0 14px #ffcc3333}
.history-card-title{font-size:16px;font-weight:bold;overflow-wrap:anywhere;margin-bottom:6px}
.history-card-preview{font-size:14px;color:#dce4ff;margin:7px 0}
.history-card-date{font-size:12px;color:#b9c8ef}
.history-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.history-actions button{
 padding:8px 10px;border-radius:10px;border:1px solid #ffffff55;
 background:#ffffff20;color:white;font-size:13px
}
.history-actions button.danger{border-color:#ff8888;background:#ff333322}
.search-count{font-size:13px;color:#dce4ff;margin:8px 3px}
.modal-overlay{
 display:none;position:fixed;inset:0;z-index:100;background:#0009;
 align-items:center;justify-content:center;padding:18px
}
.modal{width:min(100%,420px);padding:20px;border-radius:20px}
.modal h3{margin-top:0}
.modal input{
 width:100%;padding:12px;border-radius:10px;
 border:1px solid #ffffff66;background:#ffffff18;color:white
}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}
.modal-actions button{
 border:1px solid #ffffff66;background:#ffffff20;
 color:white;border-radius:10px;padding:10px 14px
}
.modal-actions .primary{background:linear-gradient(135deg,#a72aff,#155dff);border:0}

/* FULL PAGE CHAT */
body.chat-open{overflow:hidden}
body.chat-open .topbar,
body.chat-open #homeScreen,
body.chat-open #otherScreen{display:none!important}
body.chat-open main{position:static;width:100%;max-width:none;margin:0;padding:0}
body.chat-open #chatScreen{
 display:block!important;position:fixed;inset:0;z-index:50;
 width:100%;height:100%;height:100dvh;margin:0;padding:0;
 background:
 radial-gradient(ellipse at 15% 15%,#6415a9 0,transparent 35%),
 radial-gradient(ellipse at 90% 30%,#064e9c 0,transparent 38%),
 linear-gradient(135deg,#08052f,#101078,#080c50)
}
body.chat-open #chatScreen .panel{
 width:100%;height:100%;height:100dvh;max-width:100%;margin:0;padding:0;
 border:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;
 background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none
}
body.chat-open .chathead{
 flex:0 0 auto;padding:12px 16px;margin:0;
 border-bottom:1px solid #ffffff30;background:#08052f88
}
body.chat-open .chathead strong{font-size:18px}
body.chat-open .backbtn{background:#ffffff20}
body.chat-open #messages{
 flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 display:flex;flex-direction:column;gap:18px;
 padding:20px max(16px,calc((100vw - 850px)/2));scroll-behavior:smooth
}
body.chat-open .msg{
 max-width:min(82%,760px);padding:13px 17px;border-radius:20px;font-size:16px;
 white-space:normal;overflow-wrap:anywhere
}
body.chat-open .msg.user{
 align-self:flex-end;border:1px solid #ffffff35;border-bottom-right-radius:5px;
 background:linear-gradient(135deg,#8c35ff,#155eea);box-shadow:0 5px 20px #08052f66
}
body.chat-open .msg.ai{
 align-self:stretch;max-width:100%;width:100%;padding:8px 4px;
 background:transparent;border:0;border-radius:0;box-shadow:none;
 font-size:16px;line-height:1.75
}
body.chat-open .msg.ai .msg-actions{margin-top:14px}
body.chat-open .msg.ai .msg-actions button{background:#ffffff18}
body.chat-open .chatinput{
 flex:0 0 auto;margin:0;padding:12px 16px 8px;background:#08052fdd;
 border-top:1px solid #ffffff25;align-items:flex-end
}
body.chat-open .chatinput textarea{
 min-height:48px;max-height:140px;resize:none;border-radius:25px;
 padding:14px 17px;background:#ffffff18
}
body.chat-open .chatinput button{
 min-height:48px;min-width:52px;border-radius:50%;font-size:22px
}
body.chat-open #chatScreen .panel>div:last-of-type{
 flex:0 0 auto;margin:0;padding:0 16px 12px;background:#08052fdd
}
body.chat-open #chatStatus{flex:0 0 auto;margin:0;padding:5px 18px;background:#08052fdd}
body.chat-open .msg.ai h1,body.chat-open .msg.ai h2,body.chat-open .msg.ai h3{
 line-height:1.3;margin:18px 0 9px
}
body.chat-open .msg.ai h1{font-size:25px}
body.chat-open .msg.ai h2{font-size:22px}
body.chat-open .msg.ai h3{font-size:19px}
body.chat-open .msg.ai p{margin:9px 0}
body.chat-open .msg.ai ul,body.chat-open .msg.ai ol{padding-left:25px;margin:9px 0}
body.chat-open .msg.ai li{margin:5px 0}
body.chat-open .msg.ai pre{
 white-space:pre-wrap;overflow-x:auto;padding:14px;border-radius:12px;
 background:#050526;border:1px solid #ffffff30
}
body.chat-open .msg.ai code{
 font-family:monospace;background:#ffffff20;padding:2px 5px;border-radius:5px
}
body.chat-open .msg.ai pre code{background:transparent;padding:0}
body.chat-open .msg.ai table{
 width:100%;border-collapse:collapse;display:block;overflow-x:auto;margin:12px 0
}
body.chat-open .msg.ai th,body.chat-open .msg.ai td{
 border:1px solid #ffffff55;padding:9px;text-align:left;min-width:90px
}
body.chat-open .msg.ai blockquote{
 margin:10px 0;padding:8px 14px;border-left:3px solid #50d9ff;background:#ffffff12
}

@media(max-width:600px){
 .topbar{padding:14px 7px}
 .features{gap:9px}
 .feature{min-height:120px;padding:12px 5px}
 .feature .emoji{font-size:35px}
 .feature strong{font-size:14px}
 .prompts{gap:9px}
 .prompt{padding:11px;font-size:13px}
 .brain{font-size:82px}
 .upgrade{padding:14px}
 .upgrade strong{font-size:16px}
 .upgrade p{font-size:12px}
 .upgrade button{padding:11px 13px}
 .askbox textarea{font-size:15px}
 body.chat-open .msg{max-width:90%;font-size:15px}
 body.chat-open .msg.ai{max-width:100%}
 body.chat-open #messages{padding:16px 14px}
 body.chat-open .chathead{padding:10px}
 body.chat-open .chatinput{padding:10px}
 .photo-preview{width:78px;height:78px}
 .document-preview{min-width:135px;max-width:48%}
}
</style>
</head>

<body>

<header class="topbar">
 <div class="top-left">
  <button class="roundbtn" onclick="toggleMenu()">☰</button>
 </div>
 <div class="top-right">
  <button class="probtn" onclick="showUpgrade()">👑 Pro</button>
  <button class="avatar" onclick="showSettings()">♙</button>
 </div>
</header>

<div class="menu glass" id="menu">
 <button onclick="goHome()">⌂ Home</button>
 <button onclick="showHistory()">◷ Chat History</button>
 <button onclick="showFavorites()">☆ Favorites</button>
 <button onclick="showSettings()">⚙ Settings</button>
</div>

<main>

<section id="homeScreen">
 <div class="hero">
  <div class="brain">🧠</div>
  <h1>ZAQTIVO AI</h1>
  <p>Ask • Learn • Create • Explore</p>
 </div>

 <div class="askbox glass">
  <div class="askicon">💬</div>
  <textarea id="question" placeholder="Ask me anything..."></textarea>
  <button class="sendbtn" onclick="sendQuestion()">➤</button>
 </div>

 <div class="attach-toolbar">
  <button class="smallbtn" onclick="document.getElementById('photoInput').click()">＋ Add Photos</button>
  <button class="smallbtn" onclick="document.getElementById('homeCamera').click()">📷 Camera</button>
  <button class="smallbtn" onclick="document.getElementById('homeDocument').click()">📄 Add Documents</button>
 </div>

 <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="photoSelected(event)">
 <input id="homeCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden onchange="photoSelected(event)">
 <input id="homeDocument" type="file" accept=".pdf,.docx,.xlsx,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple hidden onchange="homeDocumentsSelected(event)">

 <div id="photoName" class="status"></div>
 <div id="homePhotoPreviews" class="photo-preview-list"></div>
 <div id="homePhotoCount" class="photo-count"></div>
 <div id="homeDocumentPreviews" class="document-preview-list"></div>
 <div id="homeDocumentCount" class="document-count"></div>
 <div id="homeVoiceStatus" class="voice-status"></div>

 <div class="features">
  <button class="feature glass" onclick="newChat()">
   <span class="emoji">💬</span><strong>New Chat</strong>
  </button>
  <button class="feature glass" onclick="document.getElementById('photoInput').click()">
   <span class="emoji">🖼️</span><strong>Upload Photos</strong>
  </button>
  <button class="feature glass" onclick="document.getElementById('homeCamera').click()">
   <span class="emoji">📷</span><strong>Use Camera</strong>
  </button>
  <button class="feature glass" onclick="startVoice('question','homeVoiceStatus')">
   <span class="emoji">🎙️</span><strong>Voice Input</strong>
  </button>
  <button class="feature glass" onclick="quickPrompt('Give me a short and clear answer to my question: ')">
   <span class="emoji">⚡</span><strong>Quick Answers</strong>
  </button>
  <button class="feature glass" onclick="quickPrompt('Help me understand this topic step by step: ')">
   <span class="emoji">📖</span><strong>Study Help</strong>
  </button>
 </div>

 <div class="section-title">
  <span>🔥 Popular Prompts</span>
  <button class="seeall" onclick="showAllPrompts()">See all →</button>
 </div>

 <div class="prompts">
  <button class="prompt glass" onclick="quickPrompt('Explain this topic in simple words: ')">
   <span class="emoji">💡</span>Explain this topic →
  </button>
  <button class="prompt glass" onclick="quickPrompt('Summarize this text: ')">
   <span class="emoji">📄</span>Summarize this text →
  </button>
  <button class="prompt glass" onclick="quickPrompt('Solve this problem step by step: ')">
   <span class="emoji">🧮</span>Solve this problem →
  </button>
  <button class="prompt glass" onclick="quickPrompt('Help me write code for: ')">
   <span class="emoji">💻</span>Write code →
  </button>
 </div>

 <div class="upgrade">
  <div>
   <strong>👑 Upgrade to Pro</strong>
   <p>Unlock more features!</p>
  </div>
  <button onclick="showUpgrade()">Explore ❯</button>
 </div>
</section>

<section id="chatScreen">
 <div class="panel glass">
  <div class="chathead">
   <button class="backbtn" onclick="goHome()">← Back</button>
   <strong id="chatHeading">ZAQTIVO AI</strong>
   <button id="stopBtn" class="backbtn hidden" onclick="stopGeneration()">■ Stop</button>
   <button class="backbtn" style="margin-left:auto" onclick="newChat()">＋ New</button>
  </div>

  <div id="messages" class="messages"></div>
  <div id="chatStatus" class="status"></div>

  <div class="chatinput">
   <textarea id="chatQuestion" placeholder="Type your message..."></textarea>
   <button id="chatSendBtn" onclick="sendChatQuestion()">➤</button>
  </div>

  <div class="attach-toolbar">
   <button class="smallbtn" onclick="document.getElementById('chatPhoto').click()">＋ Add Photos</button>
   <button class="smallbtn" onclick="document.getElementById('chatCamera').click()">📷 Camera</button>
   <button class="smallbtn" onclick="document.getElementById('chatDocument').click()">📄 Add Documents</button>
   <button class="smallbtn" onclick="startVoice('chatQuestion','chatVoiceStatus')">🎙 Voice</button>
  </div>

  <input id="chatPhoto" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="chatPhotoSelected(event)">
  <input id="chatCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden onchange="chatPhotoSelected(event)">
  <input id="chatDocument" type="file" accept=".pdf,.docx,.xlsx,.pptx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple hidden onchange="chatDocumentsSelected(event)">

  <div id="chatPhotoPreviews" class="photo-preview-list"></div>
  <div id="chatPhotoCount" class="photo-count"></div>
  <div id="chatDocumentPreviews" class="document-preview-list"></div>
  <div id="chatDocumentCount" class="document-count"></div>
  <div id="chatVoiceStatus" class="voice-status"></div>
 </div>
</section>

<section id="otherScreen">
 <div class="panel glass">
  <div class="chathead">
   <button class="backbtn" onclick="goHome()">← Back</button>
   <strong id="otherTitle">History</strong>
  </div>
  <div id="otherContent"></div>
 </div>
</section>

</main>

<div class="modal-overlay" id="renameModal">
 <div class="modal glass">
  <h3>Rename Chat</h3>
  <input id="renameInput" maxlength="80" placeholder="Enter chat name">
  <div class="modal-actions">
   <button onclick="closeRenameModal()">Cancel</button>
   <button class="primary" onclick="confirmRename()">Save</button>
  </div>
 </div>
</div>

<script>
/* =========================================
   CONFIGURATION
========================================= */

const MAX_IMAGES=5;
const MAX_DOCUMENTS=5;
const MAX_IMAGE_SIZE=10*1024*1024;
const MAX_DOCUMENT_SIZE=10*1024*1024;

const ALLOWED_DOCUMENT_EXTENSIONS=["pdf","docx","xlsx","pptx"];

let selectedImages=[];
let chatImages=[];
let selectedDocuments=[];
let chatDocuments=[];

let editingMessageElement=null;
let editingRequiresImage=false;

/* =========================================
   DATA AND STORAGE
========================================= */

function makeId(){
 return "chat_"+Date.now()+"_"+Math.random().toString(36).slice(2,9);
}

function safeParse(value,fallback){
 try{
  const parsed=JSON.parse(value);
  return parsed??fallback;
 }catch(error){
  return fallback;
 }
}

function loadData(){
 favorites=safeParse(localStorage.getItem("zaqtivo_favorites"),[]);
 const storedSessions=safeParse(localStorage.getItem("zaqtivo_sessions"),null);

 if(Array.isArray(storedSessions)){
  sessions=storedSessions;
 }else{
  const oldHistory=safeParse(localStorage.getItem("zaqtivo_history"),[]);
  sessions=oldHistory.map(item=>({
   id:makeId(),
   title:String(item.question||"Old Chat").slice(0,80),
   createdAt:item.date||new Date().toISOString(),
   updatedAt:item.date||new Date().toISOString(),
   pinned:false,
   messages:[
    {role:"user",text:String(item.question||"")},
    {role:"ai",text:String(item.answer||"")}
   ]
  }));
  saveData();
 }
}

function saveData(){
 try{
  localStorage.setItem("zaqtivo_sessions",JSON.stringify(sessions));
  localStorage.setItem("zaqtivo_favorites",JSON.stringify(favorites));

  const oldHistory=sessions.flatMap(session=>{
   const result=[];
   for(let i=0;i<session.messages.length;i++){
    if(session.messages[i].role==="user"){
     const next=session.messages[i+1];
     if(next&&next.role==="ai"){
      result.push({
       question:session.messages[i].text,
       answer:next.text,
       date:session.updatedAt
      });
     }
    }
   }
   return result;
  });

  localStorage.setItem("zaqtivo_history",JSON.stringify(oldHistory.slice(0,100)));
 }catch(error){
  console.error("Could not save data:",error);
  const status=document.getElementById("chatStatus");
  if(status)status.textContent="Storage is full. Some changes may not be saved.";
 }
}

function createSession(){
 const now=new Date().toISOString();
 const session={
  id:makeId(),title:"New Chat",createdAt:now,
  updatedAt:now,pinned:false,messages:[]
 };
 sessions.unshift(session);
 activeSessionId=session.id;
 saveData();
 return session;
}

function getActiveSession(){
 return sessions.find(s=>s.id===activeSessionId)||null;
}

function updateSessionTime(session){
 session.updatedAt=new Date().toISOString();
 const index=sessions.indexOf(session);
 if(index>0){
  sessions.splice(index,1);
  sessions.unshift(session);
 }
}

/* =========================================
   IMAGE HANDLING
========================================= */

function validateImage(file){
 if(!file)return false;

 const allowedTypes=["image/jpeg","image/png","image/webp"];

 if(!allowedTypes.includes(file.type)){
  alert("Please select a JPG, PNG or WEBP image.");
  return false;
 }

 if(file.size>MAX_IMAGE_SIZE){
  alert("Each image must be 10 MB or smaller.");
  return false;
 }

 return true;
}

function addImages(target,files){
 const current=target==="home"?selectedImages:chatImages;
 const incoming=Array.from(files||[]);
 let added=0;

 for(const file of incoming){
  if(!validateImage(file))continue;

  if(current.length>=MAX_IMAGES){
   alert("You can attach a maximum of 5 photos at a time.");
   break;
  }

  current.push(file);
  added++;
 }

 if(target==="home"){
  document.getElementById("photoInput").value="";
  document.getElementById("homeCamera").value="";
 }else{
  document.getElementById("chatPhoto").value="";
  document.getElementById("chatCamera").value="";
 }

 renderImagePreviews(target);

 if(added){
  const status=target==="home"
   ?document.getElementById("photoName")
   :document.getElementById("chatStatus");
  status.textContent=added+" photo(s) added.";
 }
}

 addImages("home",event.target.files);
}

function chatPhotoSelected(event){
 addImages("chat",event.target.files);
}

function removeImage(target,index){
 if(target==="home")selectedImages.splice(index,1);

}

  :"";
}

function getDocumentExtension(file){
 const name=String(file.name||"").toLowerCase();
 const index=name.lastIndexOf(".");
 return index>=0?name.slice(index+1):"";
}

function validateDocument(file){
 if(!file)return false;

 const extension=getDocumentExtension(file);

 if(!ALLOWED_DOCUMENT_EXTENSIONS.includes(extension)){
  alert("Please select a PDF, DOCX, XLSX or PPTX document.");
  return false;
 }

 if(file.size>MAX_DOCUMENT_SIZE){
  alert("Each document must be 10 MB or smaller.");
  return false;
 }

 if(file.size===0){

  return false;
 }

 return true;
}

}

/* =========================================
   VOICE INPUT
========================================= */

function startVoice(target="question",statusId="homeVoiceStatus"){
 const SpeechRecognition=
  window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Voice input is not supported in this browser. Try a supported browser.");
  return;
 }

 if(activeRecognition){
  try{activeRecognition.stop()}catch(error){}
  activeRecognition=null;
 }

 const recognition=new SpeechRecognition();
 recognition.lang=navigator.language||"en-US";
 recognition.interimResults=true;
 recognition.continuous=false;

 const status=document.getElementById(statusId);
 const input=document.getElementById(target);

 let finalTranscript="";
 let hadError=false;

 status.textContent="🎙 Listening... Speak now.";
 activeRecognition=recognition;

 recognition.onresult=event=>{
  let interimTranscript="";

  for(let i=event.resultIndex;i<event.results.length;i++){
   const transcript=event.results[i][0].transcript;

   if(event.results[i].isFinal)finalTranscript+=transcript;
   else interimTranscript+=transcript;
  }

  status.textContent=interimTranscript
   ?"Listening: "+interimTranscript
   :"🎙 Processing voice...";
 };

 recognition.onerror=event=>{
  hadError=true;
  status.textContent="";

  if(event.error==="not-allowed"){
   alert("Microphone permission was denied. Allow microphone access in browser settings.");
  }else if(event.error!=="no-speech"&&event.error!=="aborted"){
   alert("Voice input failed. Please try again.");
  }
 };

 recognition.onend=()=>{
  if(finalTranscript.trim()&&!hadError){
   const existing=input.value.trim();
   const spoken=finalTranscript.trim();
   input.value=existing?existing+" "+spoken:spoken;
   input.focus();
  }

  status.textContent="";
  if(activeRecognition===recognition)activeRecognition=null;
 };

 try{
  recognition.start();
 }catch(error){
  status.textContent="";
  activeRecognition=null;
  alert("Could not start voice input. Please try again.");
 }
}

/* =========================================
   SAFE MARKDOWN
========================================= */

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[char]);
}

function formatInline(value){
 let s=escapeHTML(value);
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
 s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 s=s.replace(/\*(.+?)\*/g,"<em>$1</em>");
 s=s.replace(/__(.+?)__/g,"<strong>$1</strong>");
 return s;
}

function renderMarkdown(raw){
 const lines=String(raw).replace(/\r/g,"").split("\n");
 let html="",paragraph=[],listType=null,inCode=false,code=[];

 function flushParagraph(){
  if(paragraph.length){
   html+="<p>"+paragraph.map(formatInline).join("<br>")+"</p>";
   paragraph=[];
  }
 }

 function closeList(){
  if(listType){html+="</"+listType+">";listType=null;}
 }

 function closeParagraphAndList(){
  flushParagraph();
  closeList();
 }

 for(let i=0;i<lines.length;i++){
  const line=lines[i];

  if(line.trim().startsWith("```")){
   if(!inCode){
    closeParagraphAndList();
    inCode=true;
    code=[];
   }else{
    html+="<pre><code>"+escapeHTML(code.join("\n"))+"</code></pre>";
    inCode=false;
   }
   continue;
  }

  if(inCode){code.push(line);continue;}

  if(!line.trim()){
   closeParagraphAndList();
   continue;
  }

  if(/^\s*\|.*\|\s*$/.test(line)){
   closeParagraphAndList();
   const tableLines=[line];

   while(i+1<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i+1])){
    tableLines.push(lines[++i]);
   }

   const rows=tableLines.filter(row=>!/^\s*\|[\s:|-]+\|\s*$/.test(row));

   if(rows.length){
    html+="<table>";
    rows.forEach((row,index)=>{
     const cells=row.trim().replace(/^\|/,"").replace(/\|$/,"").split("|");
     html+="<tr>"+cells.map(cell=>{
      const tag=index===0?"th":"td";
      return "<"+tag+">"+formatInline(cell.trim())+"</"+tag+">";
     }).join("")+"</tr>";
    });
    html+="</table>";
   }
   continue;
  }

  const heading=line.match(/^(#{1,3})\s+(.+)$/);
  if(heading){
   closeParagraphAndList();
   const level=heading[1].length;
   html+="<h"+level+">"+formatInline(heading[2])+"</h"+level+">";
   continue;
  }

  if(/^\s*[-*]\s+/.test(line)){
   flushParagraph();
   if(listType!=="ul"){
    closeList();
    html+="<ul>";
    listType="ul";
   }
   html+="<li>"+formatInline(line.replace(/^\s*[-*]\s+/,""))+"</li>";
   continue;
  }

  if(/^\s*\d+[.)]\s+/.test(line)){
   flushParagraph();
   if(listType!=="ol"){
    closeList();
    html+="<ol>";
    listType="ol";
   }
   html+="<li>"+formatInline(line.replace(/^\s*\d+[.)]\s+/,""))+"</li>";
   continue;
  }

  if(line.startsWith(">")){
   closeParagraphAndList();
   html+="<blockquote>"+formatInline(line.replace(/^>\s?/,""))+"</blockquote>";
   continue;
  }

  closeList();
  paragraph.push(line);
 }

 if(inCode)html+="<pre><code>"+escapeHTML(code.join("\n"))+"</code></pre>";
 closeParagraphAndList();
 return html;
}

/* =========================================
   MESSAGE DISPLAY
========================================= */

function addMessage(text,type,relatedQuestion="",persist=false,existingIndex=null){
 const wrap=document.createElement("div");
 wrap.className="msg "+type;

 const content=document.createElement("div");

 if(type==="ai")content.innerHTML=renderMarkdown(text);
 else content.textContent=text;

 wrap.appendChild(content);

 const session=getActiveSession();

 if(persist&&session){
  session.messages.push({
   role:type,text:String(text),date:new Date().toISOString()
  });
  wrap.dataset.messageIndex=String(session.messages.length-1);
  updateSessionTime(session);
  saveData();
 }else if(existingIndex!==null){
  wrap.dataset.messageIndex=String(existingIndex);
 }

 if(type==="user"){
  let pressTimer=null;

  function clearPressTimer(){
   if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  }

  wrap.addEventListener("pointerdown",event=>{
   if(event.target.closest("button"))return;
   clearPressTimer();

   pressTimer=setTimeout(()=>{
    if(wrap.querySelector(".edit-message-btn"))return;

    const edit=document.createElement("button");
    edit.className="edit-message-btn";
    edit.textContent="✎ Edit";
    edit.addEventListener("pointerdown",event=>event.stopPropagation());
    edit.addEventListener("click",()=>editUserMessage(wrap));
    wrap.appendChild(edit);
   },2000);
  });

  ["pointerup","pointerleave","pointercancel"].forEach(eventName=>{
   wrap.addEventListener(eventName,clearPressTimer);
  });

  wrap.addEventListener("contextmenu",event=>event.preventDefault());
 }

 if(type==="ai"){
  const actions=document.createElement("div");
  actions.className="msg-actions";

  const copy=document.createElement("button");
  copy.textContent="Copy";
  copy.onclick=()=>copyText(text);

  const save=document.createElement("button");
  save.textContent="☆ Save";
  save.onclick=()=>saveFavorite(text);

  const regenerate=document.createElement("button");
  regenerate.textContent="↻ Regenerate";
  regenerate.onclick=()=>regenerateAnswer(wrap);

  actions.append(copy,save,regenerate);
  wrap.appendChild(actions);
 }

 document.getElementById("messages").appendChild(wrap);
 const messages=document.getElementById("messages");
 messages.scrollTop=messages.scrollHeight;
}

/* =========================================
   EDIT MESSAGE
========================================= */

function editUserMessage(messageElement){
 if(isGenerating){
  alert("Stop the current response before editing.");
  return;
 }

 editingMessageElement=messageElement;
 const input=document.getElementById("chatQuestion");
 const text=messageElement.querySelector("div").textContent;

 const imageMarker=text.match(/\n\[\d+ image\(s\) attached\]$/);
 const documentMarker=text.match(/\n\[\d+ document\(s\) attached\]$/);

 editingRequiresImage=Boolean(imageMarker);
 editingRequiresDocument=Boolean(documentMarker);

 let cleanText=text;
 cleanText=cleanText.replace(/\n\[\d+ image\(s\) attached\]$/,"");
 cleanText=cleanText.replace(/\n\[\d+ document\(s\) attached\]$/,"");

 input.value=cleanText;

 const reminders=[];
 if(editingRequiresImage)reminders.push("reattach the original photo(s)");
 if(editingRequiresDocument)reminders.push("reattach the original document(s)");

 document.getElementById("chatStatus").textContent=
  reminders.length
   ?"This message had attachments. Please "+reminders.join(" and ")+" before sending."
   :"Editing message — send to update the conversation";

 input.focus();
 input.setSelectionRange(input.value.length,input.value.length);
}

function removeMessagesFromEditedMessage(){
 if(!editingMessageElement)return;

 const messages=document.getElementById("messages");
 const allMessages=Array.from(messages.children);
 const startIndex=allMessages.indexOf(editingMessageElement);

 if(startIndex!==-1)allMessages.slice(startIndex).forEach(message=>message.remove());

 const session=getActiveSession();

 if(session){
  const messageIndex=Number(editingMessageElement.dataset.messageIndex);

  if(Number.isInteger(messageIndex)&&messageIndex>=0){
   session.messages.splice(messageIndex);
   updateSessionTime(session);
   saveData();
  }
 }

 editingMessageElement=null;
 editingRequiresImage=false;
 editingRequiresDocument=false;
}

/* =========================================
   COPY AND FAVORITES
========================================= */

function copyText(text){
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text)
   .then(()=>alert("Copied!"))
   .catch(()=>fallbackCopy(text));
 }else{
  fallbackCopy(text);
 }
}

function fallbackCopy(text){
 const el=document.createElement("textarea");
 el.value=text;
 document.body.appendChild(el);
 el.select();

 try{
  document.execCommand("copy");
  alert("Copied!");
 }catch(error){
  alert("Could not copy.");
 }

 el.remove();
}

function saveFavorite(answer){
 if(favorites.includes(answer)){
  alert("Already saved.");
  return;
 }

 favorites.unshift(answer);
 saveData();
 alert("Saved to Favorites!");
}

/* =========================================
   BACKEND REQUEST - IMAGES + DOCUMENTS
========================================= */

async function askBackend(question,imageFiles=[],documentFiles=[]){
 const formData=new FormData();
 formData.append("question",question);

 imageFiles.forEach(file=>{
  formData.append("images",file,file.name);
 });

 documentFiles.forEach(file=>{
  formData.append("documents",file,file.name);
 });

 const controller=new AbortController();
 activeController=controller;

 const timeout=setTimeout(()=>controller.abort(),90000);

 try{
  const response=await fetch("/api/solve",{
   method:"POST",
   body:formData,
   signal:controller.signal
  });

  const data=await response.json().catch(()=>({}));

  if(!response.ok){
   throw new Error(data.error||data.message||"Server error "+response.status);
  }

  const answer=data.answer||data.text||data.response||data.result;

  if(!answer)throw new Error("AI returned an empty answer.");

  return answer;
 }finally{
  clearTimeout(timeout);
  if(activeController===controller)activeController=null;
 }
}

function stopGeneration(){
 if(!activeController)return;

 stopRequested=true;
 activeController.abort();
 document.getElementById("chatStatus").textContent="Generation stopped.";
}

/* =========================================
   REGENERATE ANSWER
========================================= */

function regenerateAnswer(aiMessage){
 if(isGenerating)return;

 const messages=document.getElementById("messages");
 const all=Array.from(messages.children);
 const aiIndex=all.indexOf(aiMessage);

 if(aiIndex<0)return;

 let userIndex=aiIndex-1;

 while(userIndex>=0&&!all[userIndex].classList.contains("user"))userIndex--;

 if(userIndex<0)return;

 const question=all[userIndex].querySelector("div").textContent;

 if(/\[\d+ image\(s\) attached\]/.test(question)||
    /\[\d+ document\(s\) attached\]/.test(question)){
  alert("This message originally contained attachments. Please send the question again with the original photo(s) and document(s) attached.");
  return;
 }

 const session=getActiveSession();

 if(session){
  const messageIndex=Number(all[userIndex].dataset.messageIndex);

  if(Number.isInteger(messageIndex)&&messageIndex>=0){
   session.messages.splice(messageIndex);
   updateSessionTime(session);
   saveData();
  }
 }

 all.slice(userIndex).forEach(message=>message.remove());
 sendToAI(question,[],[]);
}

async function sendQuestion(){

 const question=document.getElementById("question").value.trim();

 if(!question&&!selectedImages.length&&!selectedDocuments.length){
  alert("Please type a question or upload a photo or document.");
  return;
 }

 const images=[...selectedImages];
 const documents=[...selectedDocuments];

 selectedImages=[];
 selectedDocuments=[];

 document.getElementById("photoInput").value="";
 document.getElementById("homeCamera").value="";
 document.getElementById("homeDocument").value="";
 document.getElementById("photoName").textContent="";
 document.getElementById("question").value="";

 renderImagePreviews("home");
 renderDocumentPreviews("home");

 newChat();

 await sendToAI(
  question||"Please examine the uploaded file(s) and explain their contents.",
  images,
  documents
 );
}

/* =========================================
   SEND FROM CHAT
========================================= */

async function sendChatQuestion(){
 if(isGenerating)return;

 const question=document.getElementById("chatQuestion").value.trim();

 if(!question&&!chatImages.length&&!chatDocuments.length){
  alert("Please type a question or upload a photo or document.");
  return;
 }

 if(editingRequiresImage&&!chatImages.length){
  alert("Please attach the original image(s) again before updating this message.");
  return;
 }

 if(editingRequiresDocument&&!chatDocuments.length){
  alert("Please attach the original document(s) again before updating this message.");
  return;
 }

 const images=[...chatImages];
 const documents=[...chatDocuments];

 chatImages=[];
 chatDocuments=[];

 document.getElementById("chatPhoto").value="";
 document.getElementById("chatCamera").value="";
 document.getElementById("chatDocument").value="";
 document.getElementById("chatQuestion").value="";

 renderImagePreviews("chat");
 renderDocumentPreviews("chat");

 if(editingMessageElement)removeMessagesFromEditedMessage();

 document.getElementById("chatStatus").textContent="";

 await sendToAI(
  question||"Please examine the uploaded file(s) and explain their contents.",
  images,
  documents
 );
}

/* =========================================
   SEND TO AI
========================================= */

async function sendToAI(question,images=[],documents=[]){
 if(isGenerating)return;

 let session=getActiveSession();
 if(!session)session=createSession();

 isGenerating=true;

 const imageList=Array.isArray(images)?images:[];
 const documentList=Array.isArray(documents)?documents:[];

 let displayedQuestion=question;

 if(imageList.length){
  displayedQuestion+="\n["+imageList.length+" image(s) attached]";
 }

 if(documentList.length){
  displayedQuestion+="\n["+documentList.length+" document(s) attached]";
 }

 addMessage(displayedQuestion,"user","",true);

 if(session.title==="New Chat"||!session.title){
  session.title=question.slice(0,55)||
   (documentList.length?"Document Question":"Image Question");
  updateSessionTime(session);
  saveData();
 }

 document.getElementById("chatHeading").textContent=session.title;

 const status=document.getElementById("chatStatus");
 status.textContent="ZAQTIVO AI is thinking...";

 stopRequested=false;

 document.getElementById("stopBtn").classList.remove("hidden");
 document.getElementById("chatSendBtn").disabled=true;

 try{
  const answer=await askBackend(question,imageList,documentList);
  addMessage(answer,"ai",question,true);
  status.textContent="";
 }catch(error){
  if(error.name==="AbortError"&&stopRequested){
   status.textContent="Generation stopped.";
  }else{
   const message=error.name==="AbortError"
    ?"Request timed out. Please try again."
    :(error.message||"Please try again.");

   addMessage("Sorry, I couldn't get an answer.\n"+message,"ai",question,true);
   status.textContent="Request failed.";
  }
 }finally{
  isGenerating=false;
  document.getElementById("chatSendBtn").disabled=false;
  document.getElementById("stopBtn").classList.add("hidden");
  stopRequested=false;
  saveData();
 }
}

/* =========================================
   HISTORY SEARCH
========================================= */

function showHistory(){
 document.body.classList.remove("chat-open");
 hideScreens();

 document.getElementById("otherScreen").style.display="block";
 document.getElementById("otherTitle").textContent="Chat History";

 const box=document.getElementById("otherContent");

 box.innerHTML=`
  <div class="history-toolbar">
   <input id="historySearch" type="search" placeholder="🔎 Search your chats...">
   <button class="smallbtn" onclick="newChat()">＋ New Chat</button>
  </div>
  <div id="historyCount" class="search-count"></div>
  <div id="historyList"></div>
 `;

 document.getElementById("historySearch").addEventListener("input",renderHistoryList);
 renderHistoryList();
}

function renderHistoryList(){
 const list=document.getElementById("historyList");
 const count=document.getElementById("historyCount");
 const search=document.getElementById("historySearch");

 if(!list||!count||!search)return;

 const query=search.value.trim().toLowerCase();

 const filtered=sessions.filter(session=>{
  const content=[session.title,...session.messages.map(m=>m.text)].join(" ").toLowerCase();
  return content.includes(query);
 });

 filtered.sort((a,b)=>{
  if(a.pinned!==b.pinned)return a.pinned?-1:1;
  return new Date(b.updatedAt)-new Date(a.updatedAt);
 });

 count.textContent=filtered.length+" chat(s) found";
 list.innerHTML="";

 if(!filtered.length){
  list.innerHTML='<div class="empty">No chats found.</div>';
  return;
 }

 filtered.forEach(session=>{
  const card=document.createElement("div");
  card.className="history-card glass"+(session.pinned?" pinned":"");

  const title=document.createElement("div");
  title.className="history-card-title";
  title.textContent=(session.pinned?"📌 ":"")+session.title;

  const lastMessage=session.messages[session.messages.length-1];

  const preview=document.createElement("div");
  preview.className="history-card-preview";
  preview.textContent=lastMessage?lastMessage.text.slice(0,150):"Empty chat";

  const date=document.createElement("div");
  date.className="history-card-date";
  date.textContent="Updated: "+new Date(session.updatedAt).toLocaleString();

  const actions=document.createElement("div");
  actions.className="history-actions";

  const open=document.createElement("button");
  open.textContent="Open";
  open.onclick=()=>openSession(session.id);

  const rename=document.createElement("button");
  rename.textContent="✎ Rename";
  rename.onclick=()=>openRenameModal(session.id);

  const pin=document.createElement("button");
  pin.textContent=session.pinned?"Unpin":"📌 Pin";
  pin.onclick=()=>togglePin(session.id);

  const share=document.createElement("button");
  share.textContent="↗ Share";
  share.onclick=()=>shareSession(session.id);

  const remove=document.createElement("button");
  remove.className="danger";
  remove.textContent="Delete";
  remove.onclick=()=>deleteSession(session.id);

  actions.append(open,rename,pin,share,remove);
  card.append(title,preview,date,actions);
  list.appendChild(card);
 });
}

/* =========================================
   RENAME CHAT
========================================= */

function openRenameModal(sessionId){
 const session=sessions.find(s=>s.id===sessionId);
 if(!session)return;

 renameSessionId=sessionId;
 document.getElementById("renameInput").value=session.title;
 document.getElementById("renameModal").style.display="flex";

 setTimeout(()=>document.getElementById("renameInput").focus(),100);
}

function closeRenameModal(){
 document.getElementById("renameModal").style.display="none";
 renameSessionId=null;
}

function confirmRename(){
 const session=sessions.find(s=>s.id===renameSessionId);
 const newTitle=document.getElementById("renameInput").value.trim();

 if(!session){closeRenameModal();return;}

 if(!newTitle){
  alert("Please enter a chat name.");
  return;
 }

 session.title=newTitle.slice(0,80);
 updateSessionTime(session);

 if(activeSessionId===session.id){
  document.getElementById("chatHeading").textContent=session.title;
 }

 saveData();
 closeRenameModal();

 if(document.getElementById("historyList"))renderHistoryList();
}

/* =========================================
   PIN AND DELETE
========================================= */

function togglePin(sessionId){
 const session=sessions.find(s=>s.id===sessionId);
 if(!session)return;

 session.pinned=!session.pinned;
 saveData();
 renderHistoryList();
}

function deleteSession(sessionId){
 const session=sessions.find(s=>s.id===sessionId);
 if(!session)return;

 if(!confirm("Delete this chat permanently?"))return;

 sessions=sessions.filter(s=>s.id!==sessionId);

 if(activeSessionId===sessionId)activeSessionId=null;

 saveData();
 renderHistoryList();
}

/* =========================================
   SHARE CHAT
========================================= */

async function shareSession(sessionId){
 const session=sessions.find(s=>s.id===sessionId);
 if(!session)return;

 const text=[
  "ZAQTIVO AI - "+session.title,
  "",
  ...session.messages.map(message=>{
   return (message.role==="user"?"You: ":"ZAQTIVO AI: ")+message.text;
  })
 ].join("\n\n");

 if(navigator.share){
  try{
   await navigator.share({title:"ZAQTIVO AI - "+session.title,text});
  }catch(error){
   if(error.name!=="AbortError")copyText(text);
  }
 }else{
  copyText(text);
 }
}

/* =========================================
   FAVORITES
========================================= */

function showFavorites(){
 document.body.classList.remove("chat-open");
 hideScreens();

 document.getElementById("otherScreen").style.display="block";
 document.getElementById("otherTitle").textContent="Favorites";

 const box=document.getElementById("otherContent");
 box.innerHTML="";

 if(!favorites.length){
  box.innerHTML='<div class="empty">No saved answers yet.</div>';
  return;
 }

 favorites.forEach((item,index)=>{
  const div=document.createElement("div");
  div.className="historyitem glass";

  const p=document.createElement("p");
  p.textContent=item;

  const copy=document.createElement("button");
  copy.className="smallbtn";
  copy.textContent="Copy";
  copy.onclick=()=>copyText(item);

  const remove=document.createElement("button");
  remove.className="smallbtn";
  remove.textContent="Remove";
  remove.style.marginLeft="8px";

  remove.onclick=()=>{
   favorites.splice(index,1);
   saveData();
   showFavorites();
  };

  div.append(p,copy,remove);
  box.appendChild(div);
 });
}

/* =========================================
   KEYBOARD EVENTS
========================================= */

document.getElementById("question").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendQuestion();
 }
});

document.getElementById("chatQuestion").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendChatQuestion();

});

document.getElementById("renameInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  e.preventDefault();
  confirmRename();
 }
});

});
